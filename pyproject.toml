[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobscout"
version = "1.1.0"
description = "Async structured data collector with retry logic, rate limiting, and deduplication"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Hermes Studio" }]
keywords = ["async", "scraper", "collector", "data", "http", "rss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.8",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
jobscout = "jobscout.cli:main"

[project.urls]
Homepage = "https://github.com/hermes-studio/jobscout"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
